spring.application.name=AuctionSystem
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.csrf.enabled=${CSRF_ENABLED:false}
# --- MONGODB CONFIGURATION ---
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=auction_system_db
spring.data.mongodb.auto-index-creation=true
# --- REDIS CONFIGURATION ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
# --- CUSTOM AUTH SESSION CONFIGURATION ---
auction.auth.session.max-age-seconds=86400
# --- LOGGING ---
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR