spring.application.name=AuctionSystem
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.data.redis.url=${REDIS_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.csrf.cookie.secure=${CSRF_COOKIE_SECURE:true}
app.csrf.cookie.same-site=${CSRF_COOKIE_SAME_SITE:None}
app.security.csrf.enabled=${CSRF_ENABLED:true}